<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Report — {{ ticker }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.5; }
        h1 { color: #1f4e79; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #999; padding: 8px; text-align: left; }
        th { background-color: #f0f0f0; }
        .green { color: green; }
        .red { color: red; }
    </style>
</head>
<body>
    <h1>{{ ticker }} Report</h1>
    <p><strong>Generation Date:</strong> {{ date }}</p>

    <h2>Key Metrics</h2>
    <table>
        <tr><th>Metric</th><th>Value</th></tr>
        {% for key, value in metrics.items() %}
        <tr>
            <td>{{ key }}</td>
            <td>{{ value }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2>Last 7 Days</h2>
    <table>
        <tr><th>Date</th><th>Closing Price</th><th>Change %</th></tr>
        {% for row in history %}
        <tr>
            <td>{{ row.date }}</td>
            <td>${{ row.close }}</td>
            <td class="{% if row.change > 0 %}green{% else %}red{% endif %}">
                {{ row.change }}%
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
